<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{fragment :: meta}"></th:block>
    <th:block th:replace="~{fragment :: styles}"></th:block>

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap.min.css" rel="stylesheet">

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">

    <title>民宿詳細</title>
</head>

<body>
    <div class="moattravel-wrapper">

        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 moattravel-container">
                <div class="row justify-content-center">
                    <div class="col-xxl-9 col-xl-10 col-lg-11">

                        <!-- パンくず -->
                        <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                <li class="breadcrumb-item"><a th:href="@{/houses}">民宿一覧</a></li>
                                <li class="breadcrumb-item active" aria-current="page">民宿詳細</li>
                            </ol>
                        </nav>

                        <!-- タイトル -->
                        <h1 class="mb-4 text-center" th:text="${house.name}"></h1>

                        <!-- エラーメッセージ -->
                        <div th:if="${errorMessage}" class="alert alert-danger">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- 画像 -->
                        <div class="mb-4">
                            <img th:if="${house.imageName}" th:src="@{/storage/{img}(img=${house.imageName})}"
                                class="w-100" alt="民宿画像">
                            <img th:unless="${house.imageName}" th:src="@{/images/noImage.png}" class="w-100"
                                alt="NO IMAGE">
                        </div>

                        <div class="container">
                            <div class="row">

                                <!-- 民宿情報 -->
                                <div class="col-lg-8 container mb-4">
                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">民宿名</span></div>
                                        <div class="col"><span th:text="${house.name}"></span></div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">説明</span></div>
                                        <div class="col">
                                            <span class="moattravel-pre-wrap" th:text="${house.description}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">宿泊料金</span></div>
                                        <div class="col">
                                            <span
                                                th:text="${#numbers.formatInteger(house.price, 1, 'COMMA') + '円'}"></span>
                                        </div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">定員</span></div>
                                        <div class="col"><span th:text="${house.capacity + '人'}"></span></div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">郵便番号</span></div>
                                        <div class="col"><span th:text="${house.postalCode}"></span></div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">住所</span></div>
                                        <div class="col"><span th:text="${house.address}"></span></div>
                                    </div>

                                    <div class="row pb-2 mb-2 border-bottom">
                                        <div class="col-4"><span class="fw-bold">電話番号</span></div>
                                        <div class="col"><span th:text="${house.phoneNumber}"></span></div>
                                    </div>
                                </div>

                                <!-- 未ログイン時 -->
                                <div sec:authorize="isAnonymous()" class="col-lg-4 px-0 ps-lg-4 mb-4">
                                    <div class="card">
                                        <div class="card-body">
                                            <p class="card-text">
                                                予約するには <a th:href="@{/login}">ログイン</a> が必要です。
                                            </p>
                                            <button type="submit" class="btn text-white shadow-sm w-100 moattravel-btn"
                                                disabled>予約する</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- ログイン済み（予約フォーム） -->
                                <div sec:authorize="isAuthenticated()" class="col-lg-4 px-0 ps-lg-4 mb-4">
                                    <div class="card">
                                        <div class="card-body">

                                            <form method="get"
                                                th:action="@{/houses/{id}/reservations/input(id=${house.id})}"
                                                th:object="${reservationInputForm}">

                                                <!-- チェックイン・チェックアウト -->
                                                <div class="form-group mb-2">
                                                    <label for="fromCheckinDateToCheckoutDate"
                                                        class="col-form-label text-md-left fw-bold">
                                                        チェックイン・チェックアウト
                                                    </label>

                                                    <div th:if="${#fields.hasErrors('fromCheckinDateToCheckoutDate')}"
                                                        class="text-danger small mb-2"
                                                        th:errors="*{fromCheckinDateToCheckoutDate}"></div>

                                                    <input id="fromCheckinDateToCheckoutDate" type="text"
                                                        class="form-control"
                                                        th:field="*{fromCheckinDateToCheckoutDate}">
                                                </div>

                                                <!-- 宿泊人数 -->
                                                <div class="form-group mb-4">
                                                    <label for="numberOfPeople"
                                                        class="col-form-label text-md-left fw-bold">
                                                        宿泊人数
                                                    </label>

                                                    <div th:if="${#fields.hasErrors('numberOfPeople')}"
                                                        class="text-danger small mb-2" th:errors="*{numberOfPeople}">
                                                    </div>

                                                    <input type="number" class="form-control"
                                                        th:field="*{numberOfPeople}" min="1">
                                                </div>

                                                <!-- 予約ボタン -->
                                                <div class="form-group">
                                                    <button type="submit"
                                                        class="btn text-white shadow-sm w-100 moattravel-btn">
                                                        予約する
                                                    </button>
                                                </div>

                                            </form>

                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <th:block th:replace="~{fragment :: scripts}"></th:block>

    <!-- Bootstrap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/js/bootstrap.bundle.min.js"></script>

    <!-- Flatpickr 本体・日本語ロケール（これらが先に読み込まれている必要あり） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/ja.min.js"></script>

    <!-- 自作の初期化スクリプトは必ず上記の後に読み込む -->
    <script th:src="@{/js/flatpickr.js}"></script>

</body>

</body>

</html>
