<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{fragment :: meta}"></th:block>
    <th:block th:replace="~{fragment :: styles}"></th:block>
    <title>予約一覧</title>
</head>

<body>
    <div class="moattravel-wrapper">

        <!-- ヘッダー -->
        <th:block th:replace="~{fragment :: header}"></th:block>

        <main>
            <div class="container moattravel-container pb-5">
                <div class="row justify-content-center">
                    <div class="col-xxl-9 col-xl-10 col-lg-11">

                        <!-- パンくず -->
                        <nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                <li class="breadcrumb-item active" aria-current="page">予約一覧</li>
                            </ol>
                        </nav>

                        <h1 class="mb-3 text-center">予約一覧</h1>

                        <!-- 予約完了メッセージ -->
                        <div th:if="${param.reserved}" class="alert alert-info">
                            予約が完了しました。
                        </div>

                        <!-- 予約一覧テーブル -->
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">民宿名</th>
                                    <th scope="col">チェックイン日</th>
                                    <th scope="col">チェックアウト日</th>
                                    <th scope="col">宿泊人数</th>
                                    <th scope="col">宿泊料金</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="reservation : ${reservationPage}">
                                    <td>
                                        <a th:href="@{/houses/{id}(id=${reservation.house.id})}"
                                            th:text="${reservation.house.name}"></a>
                                    </td>
                                    <td th:text="${reservation.checkinDate}"></td>
                                    <td th:text="${reservation.checkoutDate}"></td>
                                    <td th:text="${reservation.numberOfPeople + '名'}"></td>
                                    <td th:text="${#numbers.formatInteger(reservation.amount, 1, 'COMMA') + '円'}"></td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- ページネーション -->
                        <div th:if="${reservationPage.totalPages > 1}" class="d-flex justify-content-center">
                            <nav aria-label="予約一覧ページ">
                                <ul class="pagination">

                                    <!-- 前へ -->
                                    <li class="page-item">
                                        <span th:if="${reservationPage.first}" class="page-link disabled">前</span>
                                        <a th:unless="${reservationPage.first}"
                                            th:href="@{/reservations(page=${reservationPage.number - 1})}"
                                            class="page-link moattravel-page-link">前</a>
                                    </li>

                                    <!-- ページ番号 -->
                                    <li th:each="i : ${#numbers.sequence(0, reservationPage.totalPages - 1)}"
                                        class="page-item">
                                        <span th:if="${i == reservationPage.number}"
                                            class="page-link active moattravel-active" th:text="${i + 1}"></span>

                                        <a th:unless="${i == reservationPage.number}"
                                            th:href="@{/reservations(page=${i})}" class="page-link moattravel-page-link"
                                            th:text="${i + 1}"></a>
                                    </li>

                                    <!-- 次へ -->
                                    <li class="page-item">
                                        <span th:if="${reservationPage.last}" class="page-link disabled">次</span>
                                        <a th:unless="${reservationPage.last}"
                                            th:href="@{/reservations(page=${reservationPage.number + 1})}"
                                            class="page-link moattravel-page-link">次</a>
                                    </li>

                                </ul>
                            </nav>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <th:block th:replace="~{fragment :: footer}"></th:block>

    </div>

    <th:block th:replace="~{fragment :: scripts}"></th:block>

</body>

</html>
